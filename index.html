<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RtB 0.4 — Army Builder v20.3</title>
<style>
  :root {
    --bg:#1a1a1a; --panel:#262626; --panel-2:#303030; --text:#e8e8e8;
    --muted:#9aa0a6; --accent:#c62828; --accent-2:#8e1f1f; --green:#2e7d32; --border:#444;
    --header-bg1:#151515; --header-bg2:#2b2b2b;
    --input-bg:#303030; --input-text:#e8e8e8;
    --modal-bg:#262626; --modal-overlay:rgba(0,0,0,.75);
    --card-bg:#262626; --card-bg-2:#303030;
    --text-strong:#fff; --text-dim:#ddd;
    --amber:#ffcc80; --green-soft:#81c784; --red-soft:#ff5252;
  }
  body.light {
    --bg:#f0f0f0; --panel:#ffffff; --panel-2:#f5f5f5; --text:#222;
    --muted:#666; --accent:#c62828; --accent-2:#8e1f1f; --green:#2e7d32; --border:#ccc;
    --header-bg1:#ffffff; --header-bg2:#f0f0f0;
    --input-bg:#ffffff; --input-text:#222;
    --modal-bg:#ffffff; --modal-overlay:rgba(0,0,0,.4);
    --card-bg:#ffffff; --card-bg-2:#f0f0f0;
    --text-strong:#111; --text-dim:#333;
    --amber:#b26a00; --green-soft:#2e7d32; --red-soft:#c62828;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  header{
    position:sticky; top:0; z-index:100;
    background:linear-gradient(90deg,var(--header-bg1),var(--header-bg2));
    border-bottom:3px solid var(--accent);
    box-shadow:0 2px 12px rgba(0,0,0,.6);
    padding:14px 22px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{margin:0;font-size:20px;letter-spacing:1px}
  header h1 span{color:var(--accent)}
  .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .total-box{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:15px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .total-box b{color:var(--amber);font-size:19px}
  .total-box .remain{font-weight:700}
  .total-box .remain.ok{color:var(--green-soft)}
  .total-box .remain.over{color:var(--red-soft)}
  .limit-input{width:76px;background:var(--input-bg);border:1px solid var(--border);color:var(--input-text);padding:4px 6px;border-radius:4px}
  .settings-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:15px;font-weight:600;transition:.15s}
  .settings-btn:hover{background:var(--panel-2)}
  .battle-btn{background:var(--green);border:1px solid var(--green);color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:15px;font-weight:700;transition:.15s;white-space:nowrap}
  .battle-btn:hover{background:#1b5e20}
  .battle-btn.disabled{background:#555;border-color:#555;cursor:not-allowed;opacity:.6}

  main{display:grid;grid-template-columns:1fr 400px;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
  @media(max-width:1050px){main{grid-template-columns:1fr}}

  body.in-battle header .total-box{display:none}
  body.in-battle main{grid-template-columns:1fr;max-width:800px;padding:14px 14px 90px 14px}
  body.in-battle main > section{display:none}
  body.in-battle aside{position:static;top:auto;max-width:100%}
  body.in-battle .roster-list{max-height:none;padding-bottom:80px}
  body.in-battle .roster-actions{display:none}
  body.in-battle .roster-summary{display:none}
  body.in-battle textarea.export{display:none}
  body.in-battle .roster-item .remove{display:none}

  .stop-float{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;
    background:rgba(30,30,30,.85);border:1px solid #888;color:#fff;border-radius:10px;
    padding:12px 28px;font-size:15px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px);
    box-shadow:0 4px 18px rgba(0,0,0,.5);transition:.15s;white-space:nowrap}
  .stop-float:hover{background:rgba(60,60,60,.9);border-color:#bbb}
  body.light .stop-float{background:rgba(255,255,255,.9);border-color:#999;color:#222;box-shadow:0 4px 18px rgba(0,0,0,.25)}
  body.light .stop-float:hover{background:rgba(240,240,240,1);border-color:#666}
  body.in-battle .stop-float{display:block}

  .faction-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-bottom:10px}
  .faction-tabs.hidden{display:none}
  .faction-tabs button{
    padding:9px 10px;background:var(--panel);border:2px solid var(--border);color:var(--text);
    border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .faction-tabs button:hover{background:var(--panel-2)}
  .faction-tabs button.active[data-faction="ussr"]{border-color:#c62828;background:rgba(198,40,40,.15)}
  .faction-tabs button.active[data-faction="germany"]{border-color:#607d8b;background:rgba(96,125,139,.15)}
  .faction-tabs button.active[data-faction="usa"]{border-color:#2e7d32;background:rgba(46,125,50,.15)}
  .faction-tabs button.active[data-faction="hungary"]{border-color:#8d6e63;background:rgba(141,110,99,.15)}
  .flag-red{display:inline-block;width:18px;height:12px;background:#cc0000;border:1px solid #8b0000;border-radius:2px;vertical-align:middle;margin-right:4px}

  .unit-list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 90px);overflow-y:auto;padding-right:4px}
  .unit-row{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;cursor:pointer;transition:.12s}
  .unit-row:hover{border-color:#777;background:var(--panel-2)}
  .unit-row .info{min-width:0}
  .unit-row .name{font-weight:700;font-size:14px;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unit-row .desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .unit-row .cost{color:var(--amber);font-weight:700;white-space:nowrap;font-size:14px;min-width:64px;text-align:right}
  .unit-row select.q{background:var(--input-bg);color:var(--input-text);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:13px;cursor:pointer}
  .unit-row select.q option:disabled{color:#888}
  .unit-row .noqual{color:var(--muted);font-size:13px;min-width:50px;text-align:center}
  .unit-row button{padding:6px 12px;background:var(--accent);border:none;color:#fff;border-radius:5px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
  .unit-row button:hover{background:var(--accent-2)}
  .unit-row button.disabled{background:#555;cursor:not-allowed;opacity:.6}

  aside{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;height:fit-content;position:sticky;top:74px}
  aside h2{margin:0 0 10px;font-size:17px;border-bottom:2px solid var(--accent);padding-bottom:6px}
  .roster-list{display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow-y:auto;margin-bottom:10px}
  .roster-item{background:var(--panel-2);border-radius:5px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;cursor:pointer;transition:.12s}
  .roster-item:hover{background:var(--card-bg-2);filter:brightness(1.1)}
  .roster-item .name{flex:1}
  .roster-item .faction-flag{display:inline-block;width:16px;height:11px;background:#cc0000;border:1px solid #8b0000;border-radius:2px;vertical-align:middle;margin-right:5px}
  .roster-item .qty{background:#555;color:#fff;border-radius:4px;padding:1px 8px;font-size:12px}
  .roster-item .unit-points{color:var(--amber);font-weight:600;font-size:12px;min-width:52px;text-align:right}
  .roster-item .remove{background:transparent;border:1px solid #666;color:#ff8a80;border-radius:4px;cursor:pointer;width:24px;height:24px;font-size:15px;line-height:1}
  .roster-item .remove:hover{background:#5a1e1e}
  .empty-msg{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}
  .roster-summary{border-top:1px solid var(--border);padding-top:10px;font-size:13px;display:flex;flex-direction:column;gap:4px}
  .roster-summary .row{display:flex;justify-content:space-between}
  .roster-summary .over{color:var(--red-soft);font-weight:700}
  .roster-summary .ok{color:var(--green-soft);font-weight:700}
  .roster-actions{display:flex;gap:8px;margin-top:10px}
  .roster-actions button{flex:1;padding:9px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;font-weight:600;font-size:13px}
  .roster-actions button:hover{filter:brightness(1.1)}
  .roster-actions .primary{background:var(--green);border-color:var(--green);color:#fff}
  .roster-actions .primary:hover{background:#1b5e20}
  .roster-actions .primary.armed{background:#1565c0;border-color:#1565c0}
  .roster-actions .primary.armed:hover{background:#0d47a1}
  .roster-actions .primary.copied{background:#2e7d32;border-color:#2e7d32}
  .roster-actions .danger{background:#b71c1c;border-color:#b71c1c;color:#fff;animation:pulse .8s infinite}
  .roster-actions .danger:hover{background:#8e0000}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.6)}50%{box-shadow:0 0 0 6px rgba(198,40,40,0)}}
  textarea.export{width:100%;margin-top:8px;background:var(--input-bg);color:var(--input-text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:monospace;font-size:12px;min-height:120px;resize:vertical}
  textarea.import-area{width:100%;margin-top:8px;background:var(--input-bg);color:var(--input-text);border:1px solid var(--border);border-radius:6px;padding:8px;font-family:monospace;font-size:12px;min-height:180px;resize:vertical}
  .import-error{color:var(--red-soft);font-size:13px;margin-top:8px;white-space:pre-wrap;font-family:monospace;background:rgba(198,40,40,.1);padding:8px;border-radius:6px;border:1px solid rgba(198,40,40,.4)}

  .modal-backdrop{position:fixed;inset:0;background:var(--modal-overlay);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
  .modal-backdrop.open{display:flex}
  .modal{background:var(--modal-bg);border:2px solid var(--accent);border-radius:10px;width:100%;max-width:720px;max-height:92vh;overflow-y:auto;padding:18px 20px 20px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .modal-close{position:absolute;top:10px;right:12px;background:transparent;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:4px}
  .modal-close:hover{background:var(--panel-2);color:var(--text-strong)}
  .modal h2{margin:0 0 4px;font-size:22px;color:var(--text-strong);padding-right:32px}
  .modal .modal-faction{font-size:13px;color:var(--muted);margin-bottom:8px}
  .modal .modal-price{font-size:18px;color:var(--amber);font-weight:700;margin-bottom:12px}
  .modal .section-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin:16px 0 6px;border-bottom:1px solid var(--border);padding-bottom:4px}
  .modal .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;font-size:14px}
  .modal .stat-grid .lbl{color:var(--muted)}
  .modal .stat-grid .val{color:var(--text-strong);font-weight:600;text-align:right}
  .modal .armor-row{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
  .modal .armor-row span{background:var(--panel-2);border-radius:5px;padding:4px 10px}
  .modal .armor-row b{color:var(--amber)}
  .modal .weapon-block{background:var(--panel-2);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.5}
  .modal .weapon-block .wname{font-weight:700;color:var(--text-strong);margin-bottom:2px}
  .modal .weapon-block .wstats{color:var(--text-dim);margin-bottom:2px}
  .modal .weapon-block .wnotes{color:var(--muted);font-size:12px}
  .modal .weapon-block .wnotes div{margin-top:2px}
  .modal .rule-item{background:var(--panel-2);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.5}
  .modal .extra-line{font-size:13px;color:var(--text-dim);margin-bottom:4px}
  .modal .extra-line .lbl{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;margin-top:18px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap}
  .modal-actions button{padding:10px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:700;font-size:14px}
  .modal-actions .add{background:var(--accent);color:#fff}
  .modal-actions .add:hover{background:var(--accent-2)}
  .modal-actions .add.disabled{background:#555;cursor:not-allowed;opacity:.6}
  .modal-actions .remove-btn{background:#555;color:#fff}
  .modal-actions .remove-btn:hover{background:#666}
  .modal-actions .remove-all{background:#7a1f1f;color:#fff}
  .modal-actions .remove-all:hover{background:#5a1515}

  .settings-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  .settings-row:last-child{border-bottom:none}
  .settings-row input[type="checkbox"]{width:20px;height:20px;margin-top:2px;cursor:pointer;accent-color:var(--accent)}
  .settings-row .settings-label{font-weight:600;color:var(--text-strong);margin-bottom:2px}
  .settings-row .settings-desc{font-size:12px;color:var(--muted);line-height:1.4}
  .settings-actions{display:flex;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;justify-content:flex-end}
  .settings-actions button{padding:10px 16px;border-radius:6px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;font-weight:600;font-size:13px}
  .settings-actions button:hover{filter:brightness(1.1)}
  .settings-actions .primary{background:var(--green);border-color:var(--green);color:#fff}

  .confirm-actions{display:flex;gap:10px;margin-top:18px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;justify-content:flex-end}
  .confirm-actions button{padding:10px 16px;border-radius:6px;border:none;cursor:pointer;font-weight:700;font-size:14px}
  .confirm-actions .ok{background:#b71c1c;color:#fff}
  .confirm-actions .ok:hover{background:#8e0000}
  .confirm-actions .cancel{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .confirm-actions .cancel:hover{filter:brightness(1.1)}
</style>
</head>
<body>

<header>
  <h1>ДОРОГА НА <span>БЕРЛИН</span> — Army Builder v20.3</h1>
  <div class="header-right">
    <button id="btnRules" class="settings-btn" title="Книга правил">📖</button>
    <div class="total-box">
      <span>Очки: <b id="totalPoints">0</b></span>
      <span>Остаток: <span id="headerRemain" class="remain ok">500</span></span>
      <span>Лимит:
        <input type="number" id="limitInput" class="limit-input" value="500" min="0" step="10">
      </span>
      <button id="btnSettings" class="settings-btn" title="Настройки">⚙</button>
      <button id="btnBattle" class="battle-btn" title="Начать бой">⚔ К бою</button>
    </div>
  </div>
</header>

<main>
  <section>
    <div class="faction-tabs" id="factionTabs">
      <button data-faction="ussr" class="active"><span class="flag-red"></span> СССР</button>
      <button data-faction="germany">🇩🇪 Германия</button>
      <button data-faction="usa">🇺🇸 США</button>
      <button data-faction="hungary">🇭🇺 Венгрия</button>
    </div>
    <div class="unit-list" id="unitList"></div>
  </section>

  <aside>
    <h2>Ваш ростер</h2>
    <div class="roster-list" id="rosterList">
      <div class="empty-msg">Ростер пуст. Добавьте юнитов слева.</div>
    </div>
    <div class="roster-summary">
      <div class="row"><span>Всего очков:</span><span id="sumPoints">0</span></div>
      <div class="row"><span>Лимит:</span><span id="sumLimit">500</span></div>
      <div class="row"><span>Остаток:</span><span id="sumRemain" class="ok">500</span></div>
      <div class="row"><span>Юнитов:</span><span id="sumUnits">0</span></div>
    </div>
    <div class="roster-actions">
      <button id="btnExport" class="primary">📋 Экспорт</button>
      <button id="btnImport">📥 Импорт</button>
      <button id="btnClear">🗑 Очистить</button>
    </div>
    <textarea class="export" id="exportArea" placeholder="Текст ростера появится здесь..." readonly></textarea>
  </aside>
</main>

<button id="btnStop" class="stop-float" title="Завершить бой">✕ Отбой</button>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" title="Закрыть">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* =========================================================
   1) КОНСТАНТЫ ЦЕНЫ
   ========================================================= */
const BASE_Q = 7;
const MIN_Q = 4;
function priceForQualification(baseCost, q) {
  return Math.max(1, Math.round(baseCost * (1 + 0.10 * (q - BASE_Q))));
}
function qualificationOptions() { return [4, 5, 6, 7, 8, 9]; }

/* =========================================================
   2) FALLBACK: 10 тестовых юнитов
   ========================================================= */
const TEST_COMMON = [];
for (let i = 1; i <= 10; i++) {
  TEST_COMMON.push({
    key: "testunit" + i,
    name: "TEST UNIT " + i + " (fallback)",
    cost: i * 10,
    qual: 7,
    speed: "10 / 5",
    armor: { front: i, side: 1, rear: 1, roof: 0, bottom: 0 },
    weapons: [{ name: "Тестовое орудие", stats: "Атаки: 1, Дальность: 30 см, ББ: 1, Арка: 360°", notes: [] }],
    rules: ["Это тестовый юнит из DEFAULT_UNITS. Значит units.json не загрузился."]
  });
}
const DEFAULT_UNITS = { ussr: [], germany: [], usa: [], hungary: [], common: TEST_COMMON };

/* =========================================================
   3) LOCALSTORAGE
   ========================================================= */
const LS_KEYS = {
  settings: "rtb_settings",
  roster:   "rtb_roster",
  limit:    "rtb_limit",
  faction:  "rtb_faction",
  inBattle: "rtb_inbattle"
};
const DEFAULT_SETTINGS = { mix: false, dark: true };
let settings = Object.assign({}, DEFAULT_SETTINGS);
let pointLimit = 500;
let currentFaction = "ussr";
let roster = {};
let rosterCounter = 0;
let inBattle = false;

function loadSettings() {
  try {
    const raw = localStorage.getItem(LS_KEYS.settings);
    if (raw) settings = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
  } catch (e) { console.warn("Не удалось прочитать настройки", e); }
  applyTheme();
}
function saveSettings() {
  try { localStorage.setItem(LS_KEYS.settings, JSON.stringify(settings)); }
  catch (e) { console.warn("Не удалось сохранить настройки", e); }
}
function applyTheme() { document.body.classList.toggle("light", !settings.dark); }

function loadLimit() {
  try {
    const raw = localStorage.getItem(LS_KEYS.limit);
    if (raw !== null) {
      const n = parseInt(raw, 10);
      if (!isNaN(n) && n >= 0) pointLimit = n;
    }
  } catch (e) { console.warn("Не удалось прочитать лимит", e); }
}
function saveLimit() {
  try { localStorage.setItem(LS_KEYS.limit, String(pointLimit)); }
  catch (e) { console.warn("Не удалось сохранить лимит", e); }
}
function loadFaction() {
  try {
    const f = localStorage.getItem(LS_KEYS.faction);
    if (f && ["ussr","germany","usa","hungary"].includes(f)) currentFaction = f;
  } catch (e) { console.warn("Не удалось прочитать фракцию", e); }
}
function saveFaction() {
  try { localStorage.setItem(LS_KEYS.faction, currentFaction); }
  catch (e) { console.warn("Не удалось сохранить фракцию", e); }
}
function loadRoster() {
  try {
    const raw = localStorage.getItem(LS_KEYS.roster);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
        roster = parsed;
        let maxN = -1;
        for (const k in roster) {
          const m = /^r(\d+)$/.exec(k);
          if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
        }
        rosterCounter = maxN + 1;
      }
    }
  } catch (e) { console.warn("Не удалось прочитать ростер", e); }
}
function saveRoster() {
  try { localStorage.setItem(LS_KEYS.roster, JSON.stringify(roster)); }
  catch (e) { console.warn("Не удалось сохранить ростер", e); }
}
function loadBattle() {
  try { inBattle = localStorage.getItem(LS_KEYS.inBattle) === "true"; }
  catch (e) { console.warn("Не удалось прочитать режим боя", e); }
}
function saveBattle() {
  try { localStorage.setItem(LS_KEYS.inBattle, String(inBattle)); }

   4) UNITS + ВСПОМОГАТЕЛЬНЫЕ

let UNITS = {};
const els = {
  list: document.getElementById("unitList"),
  rosterList: document.getElementById("rosterList"),
  totalPoints: document.getElementById("totalPoints"),
  headerRemain: document.getElementById("headerRemain"),
  limitInput: document.getElementById("limitInput"),
  sumPoints: document.getElementById("sumPoints"),
  sumLimit: document.getElementById("sumLimit"),
  sumRemain: document.getElementById("sumRemain"),
  sumUnits: document.getElementById("sumUnits"),
  exportArea: document.getElementById("exportArea"),
  modalBackdrop: document.getElementById("modalBackdrop"),
  modalContent: document.getElementById("modalContent"),
  modalClose: document.getElementById("modalClose"),
  factionTabs: document.getElementById("factionTabs")
};

function getAllUnits() {
  const all = [];
  for (const f in UNITS) for (const u of UNITS[f]) all.push(Object.assign({}, u, { faction: f }));
  return all;
}
function getUnitById(id) { return getAllUnits().find(u => u.id === id); }
function unitPrice(unit, q) { return unit.noQual ? unit.cost : priceForQualification(unit.cost, q); }

function getRosterPoints() {
  let total = 0;
  for (const key in roster) {
    const entry = roster[key];
    const unit = getUnitById(entry.unitId);
    if (unit) total += unitPrice(unit, entry.q) * entry.count;
  }
  return total;
}
function getRosterUnitCount() {
  let n = 0;
  for (const key in roster) n += roster[key].count;
  return n;
}
function getRosterFactions() {
  const set = new Set();
  for (const key in roster) {
    const u = getUnitById(roster[key].unitId);
    if (u) set.add(u.faction);
  }
  return set;
}
function maxAffordableQ(unit, remaining) {
  if (unit.noQual) return BASE_Q;
  for (let q = BASE_Q; q >= MIN_Q; q--) {
    if (priceForQualification(unit.cost, q) <= remaining) return q;
  }
  return null;
}
function shortDesc(unit) {
  const bits = [];
  if (unit.qual !== undefined && unit.qual !== null) bits.push("Квал. " + unit.qual);
  if (unit.speed) bits.push(unit.speed);
  if (unit.armor) bits.push(unit.armor.front + "/" + unit.armor.side + "/" + unit.armor.rear + "/" + unit.armor.roof + "/" + unit.armor.bottom);
  if (unit.weapons && unit.weapons.length) bits.push(unit.weapons.map(w => w.name.split("(")[0].trim()).join(" · "));
  if (unit.rules && unit.rules.length) bits.push(unit.rules[0].split(".")[0] + "...");
  if (unit.extra) unit.extra.forEach(e => bits.push(e.label + ": " + e.value.split(",")[0]));
  return bits.join(" · ");
}

const FACTION_FLAGS = {
  ussr: { emoji: null, css: "flag-red" },
  germany: { emoji: "🇩🇪" },
  usa: { emoji: "🇺🇸" },
  hungary: { emoji: "🇭🇺" }
};
function factionFlagHTML(faction) {
  const f = FACTION_FLAGS[faction];
  if (!f) return "";
  if (f.css) return '<span class="faction-flag"></span>';
  return '<span style="margin-right:5px">' + f.emoji + '</span>';
}

function updateFactionTabsVisibility() {
  if (inBattle) { els.factionTabs.classList.add("hidden"); return; }
  const isEmpty = getRosterUnitCount() === 0;
  const shouldShow = settings.mix || isEmpty;
  if (shouldShow) els.factionTabs.classList.remove("hidden");
  else els.factionTabs.classList.add("hidden");
}
function updateBattleButtons() {
  const btnBattle = document.getElementById("btnBattle");
  if (!btnBattle) return;
  if (inBattle) {
    btnBattle.style.display = "none";
  } else {
    btnBattle.style.display = "";
    const has = getRosterUnitCount() > 0;
    btnBattle.classList.toggle("disabled", !has);
    btnBattle.disabled = !has;
    btnBattle.title = has ? "Начать бой" : "Сначала соберите ростер";
  }
}
function setBattleMode(on) {
  inBattle = !!on;
  document.body.classList.toggle("in-battle", inBattle);
  saveBattle();
  updateBattleButtons();
  updateFactionTabsVisibility();
  resetExportButton();
  renderRoster();
}

let exportArmed = false;
let exportCopyTimer = null;

function resetExportButton() {
  exportArmed = false;
  if (exportCopyTimer) { clearTimeout(exportCopyTimer); exportCopyTimer = null; }
  const btn = document.getElementById("btnExport");
  if (!btn) return;
  btn.textContent = "📋 Экспорт";
  btn.classList.remove("armed", "copied");
}

function copyExportToClipboard() {
  const text = (els.exportArea && els.exportArea.value) || "";
  if (!text) return;
  const done = () => {
    const btn = document.getElementById("btnExport");
    if (btn) {
      btn.textContent = "✅ Скопировано";
      btn.classList.remove("armed");
      btn.classList.add("copied");
    }
    if (exportCopyTimer) clearTimeout(exportCopyTimer);
    exportCopyTimer = setTimeout(() => { resetExportButton(); }, 1500);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallbackCopy);
    return;
  }
  fallbackCopy();
  function fallbackCopy() {
    try {
      els.exportArea.focus();
      els.exportArea.select();
      const ok = document.execCommand("copy");
      if (ok) done();
      else console.warn("Копирование не удалось (execCommand)");
    } catch (e) { console.warn("Копирование не удалось", e); }
  }
}

function openUnitCard(unitId, fromRosterKey) {
  const unit = getUnitById(unitId);
  if (!unit) return;
  const fromRoster = !!fromRosterKey;
  const entry = fromRoster ? roster[fromRosterKey] : null;
  let q;
  if (entry) q = entry.q;
  else if (unit.noQual) q = BASE_Q;
  else {
    const remaining = pointLimit - getRosterPoints();
    const maxQ = maxAffordableQ(unit, remaining);
    q = maxQ !== null ? maxQ : MIN_Q;
  }
  const price = unitPrice(unit, q);
  const fname = { ussr:"СССР", germany:"Германия", usa:"США", hungary:"Венгрия" }[unit.faction] || unit.faction;

  let html = '<h2>' + unit.name + '</h2>';
  html += '<div class="modal-faction">' + factionFlagHTML(unit.faction) + fname + '</div>';
  html += '<div class="modal-price">' + price + ' очк.' + (unit.noQual ? '' : ' <small style="color:var(--muted)">(★' + q + ')</small>') + '</div>';
  if (fromRoster) html += '<div class="extra-line"><span class="lbl">В ростере:</span> ×' + entry.count + '</div>';

  if (unit.extra && unit.extra.length) {
    html += '<div class="section-title">Общие сведения</div>';
    unit.extra.forEach(e => { html += '<div class="extra-line"><span class="lbl">' + e.label + ':</span> ' + e.value + '</div>'; });
  }
  if (!unit.noQual && (unit.qual !== undefined || unit.speed)) {
    html += '<div class="section-title">Характеристики</div><div class="stat-grid">';
    if (unit.qual !== undefined && unit.qual !== null) html += '<div class="lbl">Квалификация экипажа</div><div class="val">★' + unit.qual + '</div>';
    if (unit.speed) html += '<div class="lbl">Скорость (база / форсаж)</div><div class="val">' + unit.speed + '</div>';
    html += '</div>';
  }
  if (unit.armor) {
    html += '<div class="section-title">Броня</div><div class="armor-row">';
    html += '<span>Лоб <b>' + unit.armor.front + '</b></span>';
    html += '<span>Борт <b>' + unit.armor.side + '</b></span>';
    html += '<span>Корма <b>' + unit.armor.rear + '</b></span>';
    html += '<span>Крыша <b>' + unit.armor.roof + '</b></span>';
    html += '<span>Днище <b>' + unit.armor.bottom + '</b></span>';
    html += '</div>';
  }
  if (unit.weapons && unit.weapons.length) {
    html += '<div class="section-title">Вооружение</div>';
    unit.weapons.forEach(w => {
      html += '<div class="weapon-block">';
      html += '<div class="wname">' + w.name + '</div>';
      if (w.stats) html += '<div class="wstats">' + w.stats + '</div>';
      if (w.notes && w.notes.length) html += '<div class="wnotes">' + w.notes.map(n => '<div>• ' + n + '</div>').join('') + '</div>';
      html += '</div>';
    });
  }
  if (unit.rules && unit.rules.length) {
    html += '<div class="section-title">Специальные правила</div>';
    unit.rules.forEach(r => { html += '<div class="rule-item">' + r + '</div>'; });
  }

  if (!inBattle) {
    html += '<div class="modal-actions">';
    if (!fromRoster) {
      html += '<button class="add" id="modalAddBtn">Добавить в ростер</button>';
    } else {
      html += '<button class="remove-btn" id="modalRemoveOne">− Удалить один</button>';
      html += '<button class="remove-all" id="modalRemoveAll">Удалить всё</button>';
    }
    html += '</div>';
  }

  els.modalContent.innerHTML = html;

  if (!inBattle) {
    if (!fromRoster) {
      const btn = document.getElementById("modalAddBtn");
      btn.addEventListener("click", () => {
        const row = els.list.querySelector('.unit-row[data-unit-id="' + unitId + '"]');
        const select = row ? row.querySelector("select.q") : null;
        addUnitSmart(unitId, select);
        closeModal();
      });
      const remaining = pointLimit - getRosterPoints();
      const canAfford = unit.noQual ? (unit.cost <= remaining) : (maxAffordableQ(unit, remaining) !== null);
      if (!canAfford) {
        btn.classList.add("disabled");
        btn.disabled = true;
        btn.textContent = "Лимит очков";
      }
    } else {
      document.getElementById("modalRemoveOne").addEventListener("click", () => {
        removeUnit(fromRosterKey);
        if (roster[fromRosterKey]) openUnitCard(unitId, fromRosterKey);
        else closeModal();
      });
      document.getElementById("modalRemoveAll").addEventListener("click", () => {
        delete roster[fromRosterKey];
        saveRoster();
        resetExportButton();
        renderRoster();
        closeModal();
      });
    }
  }
  els.modalBackdrop.classList.add("open");
}

  const chkDark = document.getElementById("chkDark");

      settings.mix = true;
      saveSettings();
      updateFactionTabsVisibility();
      resetExportButton();

      const factions = getRosterFactions();
      if (factions.size > 1) {
        openConfirm(
          "В ростере есть юниты из разных фракций. Очистить ростер и вернуться к режиму одной фракции?",
          () => {

            saveSettings();
            roster = {};
            saveRoster();
            chkMix.checked = false;
            resetExportButton();
            renderRoster();
            updateFactionTabsVisibility();

          () => { chkMix.checked = true; }

        updateFactionTabsVisibility();
        resetExportButton();
      }
    }
  });

  btnClose.addEventListener("click", closeModal);

}

/* =========================================================
   9) ИМПОРТ
   ========================================================= */
const FACTION_NAMES_TO_KEY = { "СССР":"ussr", "Германия":"germany", "США":"usa", "Венгрия":"hungary" };

function parseRosterText(text) {
  const lines = text.split(/\r?\n/);
  const errors = [];
  const newRoster = {};
  let counter = 0;
  const re = /^\[([^\]]+)\]\s+(.+?)(?:\s+★(\d+))?\s+×\s+(\d+)\s+=\s+(\d+)\s+очк\.\s*$/;
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i].trim();
    if (!raw) continue;
    if (raw.startsWith("===") || raw.startsWith("---")) continue;
    if (/^Лимит очков:/i.test(raw)) continue;
    if (/^Использовано:/i.test(raw)) continue;
    if (/^Остаток:/i.test(raw)) continue;
    if (/^Итого юнитов:/i.test(raw)) continue;
    if (/^Итого очков:/i.test(raw)) continue;
    const m = re.exec(raw);
    if (!m) { errors.push("Строка " + (i + 1) + ": не удалось разобрать формат → «" + raw + "»"); continue; }
    const factionName = m[1].trim();
    const unitName = m[2].trim();
    const qRaw = m[3] !== undefined ? parseInt(m[3], 10) : null;
    const count = parseInt(m[4], 10);
    const factionKey = FACTION_NAMES_TO_KEY[factionName];
    if (!factionKey) { errors.push("Строка " + (i + 1) + ": неизвестная фракция «" + factionName + "»"); continue; }
    const list = UNITS[factionKey] || [];
    const unit = list.find(u => u.name === unitName);
    if (!unit) { errors.push("Строка " + (i + 1) + ": юнит «" + unitName + "» не найден в фракции «" + factionName + "»"); continue; }
    let q = BASE_Q;
    if (unit.noQual) {
      if (qRaw !== null) { errors.push("Строка " + (i + 1) + ": у юнита «" + unitName + "» квалификация не указана, а в строке стоит ★" + qRaw); continue; }
      q = BASE_Q;
    } else {
      if (qRaw === null) { errors.push("Строка " + (i + 1) + ": у юнита «" + unitName + "» не указана квалификация (★Q)"); continue; }
      if (qRaw < MIN_Q || qRaw > 9) { errors.push("Строка " + (i + 1) + ": квалификация ★" + qRaw + " вне диапазона ★" + MIN_Q + "–★9"); continue; }
      q = qRaw;
    }
    if (isNaN(count) || count < 1) { errors.push("Строка " + (i + 1) + ": количество должно быть ≥ 1"); continue; }
    const key = "r" + (counter++);
    newRoster[key] = { unitId: unit.id, q: q, count: count };
  }
  if (Object.keys(newRoster).length === 0 && errors.length === 0) errors.push("Не найдено ни одной строки с юнитами. Проверьте формат.");
  if (errors.length > 0) return { ok: false, errors: errors };
  return { ok: true, roster: newRoster, counter: counter };
}

function openImport() {
  let html = '<h2>📥 Импорт ростера</h2>';
  html += '<div style="font-size:13px;color:var(--muted);margin:6px 0 4px">Вставьте текст, скопированный из «Экспорт».<br>Если ростер уже есть — он будет заменён после подтверждения.</div>';
  html += '<textarea class="import-area" id="importText"></textarea>';
  html += '<div id="importErrorBox"></div>';
  html += '<div class="modal-actions">';
  html += '<button class="remove-btn" id="btnImportCancel">Отмена</button>';
  html += '<button class="add" id="btnImportDo">Импортировать</button>';
  html += '</div>';
  els.modalContent.innerHTML = html;

  const ta = document.getElementById("importText");
  const errBox = document.getElementById("importErrorBox");
  const btnCancel = document.getElementById("btnImportCancel");
  const btnDo = document.getElementById("btnImportDo");

  btnCancel.addEventListener("click", closeModal);
  btnDo.addEventListener("click", () => {
    const text = ta.value || "";
    if (!text.trim()) { errBox.innerHTML = '<div class="import-error">Вставьте текст ростера.</div>'; return; }
    const result = parseRosterText(text);
    if (!result.ok) { errBox.innerHTML = '<div class="import-error">' + result.errors.join("\n") + '</div>'; return; }
    const applyImport = () => {
      roster = result.roster;
      rosterCounter = result.counter;
      saveRoster();
      resetExportButton();
      renderRoster();
      closeModal();
    };
    if (getRosterUnitCount() > 0) {
      openConfirm("Текущий ростер будет заменён импортированным. Продолжить?", applyImport, null, "Импортировать");
    } else {
      applyImport();
    }
  });
  els.modalBackdrop.classList.add("open");
}

   10) РЕНДЕР КАТАЛОГА

function renderCatalog() {
  els.list.innerHTML = "";
  const units = UNITS[currentFaction] || [];
  units.forEach(unit => {
    const row = document.createElement("div");
    row.className = "unit-row";
    row.dataset.unitId = unit.id;
    row.innerHTML = '<div class="info"><div class="name">' + unit.name + '</div><div class="desc">' + shortDesc(unit) + '</div></div>';
    let select = null;
    if (unit.noQual) {
      const noq = document.createElement("div");
      noq.className = "noqual";
      noq.textContent = "—";
      noq.title = "Квалификация не указана";
      row.appendChild(noq);
    } else {
      select = document.createElement("select");
      select.className = "q";
      qualificationOptions().forEach(q => {
        const opt = document.createElement("option");
        opt.value = q;
        opt.textContent = "★" + q;
        if (q === BASE_Q) opt.selected = true;
        select.appendChild(opt);
      });
      row.appendChild(select);
    }
    const costEl = document.createElement("div");
    costEl.className = "cost";
    costEl.textContent = unit.cost + " очк.";
    row.appendChild(costEl);
    const btn = document.createElement("button");
    btn.textContent = "+";
    row.appendChild(btn);
    row.addEventListener("click", (e) => {
      if (e.target.closest("button") || e.target.closest("select")) return;
      openUnitCard(unit.id, null);
    });
    if (select) {
      select.addEventListener("change", () => {
        const remaining = pointLimit - getRosterPoints();
        const chosen = parseInt(select.value, 10);
        const maxQ = maxAffordableQ(unit, remaining);
        if (maxQ !== null && chosen > maxQ) select.value = maxQ;
        const q = parseInt(select.value, 10);
        costEl.textContent = priceForQualification(unit.cost, q) + " очк.";
        updateButtons();
      });
    }
    btn.addEventListener("click", () => addUnitSmart(unit.id, select));
    els.list.appendChild(row);
  });
  syncCatalogQualifications();
  updateButtons();
}

function syncCatalogQualifications() {
  const remaining = pointLimit - getRosterPoints();
  const rows = els.list.querySelectorAll(".unit-row");
  rows.forEach(row => {
    const unit = getUnitById(row.dataset.unitId);
    if (!unit) return;
    const select = row.querySelector("select.q");
    const costEl = row.querySelector(".cost");
    if (!select) { if (costEl) costEl.textContent = unit.cost + " очк."; return; }
    let q = MIN_Q;
    for (let cand = BASE_Q; cand >= MIN_Q; cand--) {
      if (priceForQualification(unit.cost, cand) <= remaining) { q = cand; break; }
    }
    select.value = q;
    costEl.textContent = priceForQualification(unit.cost, q) + " очк.";
  });
}

function addUnitSmart(unitId, select) {
  const unit = getUnitById(unitId);
  if (!unit) return;
  const remaining = pointLimit - getRosterPoints();
  if (unit.noQual) {
    if (unit.cost > remaining) return;
    addUnit(unitId, BASE_Q);
    return;
  }
  const chosen = select ? parseInt(select.value, 10) : BASE_Q;
  if (priceForQualification(unit.cost, chosen) <= remaining) { addUnit(unitId, chosen); return; }
  for (let q = chosen - 1; q >= MIN_Q; q--) {
    if (priceForQualification(unit.cost, q) <= remaining) {
      if (select) select.value = q;
      addUnit(unitId, q);
      return;
    }
  }
}

function updateButtons() {
  const rows = els.list.querySelectorAll(".unit-row");
  const remaining = pointLimit - getRosterPoints();
  rows.forEach(row => {
    const unit = getUnitById(row.dataset.unitId);
    if (!unit) return;
    const select = row.querySelector("select.q");
    const btn = row.querySelector("button");
    if (select) {
      select.querySelectorAll("option").forEach(opt => {
        opt.disabled = (priceForQualification(unit.cost, parseInt(opt.value, 10)) > remaining);
      });
    }
    let canAfford = false;
    if (unit.noQual) canAfford = unit.cost <= remaining;
    else {
      for (let q = BASE_Q; q >= MIN_Q; q--) {
        if (priceForQualification(unit.cost, q) <= remaining) { canAfford = true; break; }
      }
    }
    if (!canAfford) {
      btn.classList.add("disabled"); btn.textContent = "Лимит"; btn.disabled = true;
    } else {
      btn.classList.remove("disabled"); btn.textContent = "+"; btn.disabled = false;
    }
  });
}

/* =========================================================
   11) РЕНДЕР РОСТЕРА
   ========================================================= */
function renderRoster() {
  const keys = Object.keys(roster).sort((ka, kb) => {
    const ea = roster[ka], eb = roster[kb];
    const ua = getUnitById(ea.unitId), ub = getUnitById(eb.unitId);
    const qa = ua && ua.noQual ? -1 : ea.q;
    const qb = ub && ub.noQual ? -1 : eb.q;
    if (qa !== qb) return qb - qa;
    return (ua ? ua.name : "").localeCompare(ub ? ub.name : "", "ru");
  });

  const factions = getRosterFactions();
  const isMixed = factions.size > 1;

  els.rosterList.innerHTML = "";
  if (keys.length === 0) {
    els.rosterList.innerHTML = '<div class="empty-msg">Ростер пуст. Добавьте юнитов слева.</div>';
  } else {
    keys.forEach(key => {
      const entry = roster[key];
      const unit = getUnitById(entry.unitId);
      if (!unit) return;
      const price = unitPrice(unit, entry.q);
      const qLabel = unit.noQual ? "" : ' <small style="color:var(--muted)">(★' + entry.q + ')</small>';
      const flag = isMixed ? factionFlagHTML(unit.faction) : "";
      const item = document.createElement("div");
      item.className = "roster-item";
      item.innerHTML = '<span class="name">' + flag + unit.name + qLabel + '</span>' +
        '<span class="qty">×' + entry.count + '</span>' +
        '<span class="unit-points">' + (price * entry.count) + ' очк.</span>' +
        '<button class="remove" title="Удалить один" data-key="' + key + '">−</button>';
      item.addEventListener("click", (e) => {
        if (e.target.closest("button")) return;
        openUnitCard(entry.unitId, key);
      });
      item.querySelector(".remove").addEventListener("click", (e) => {
        e.stopPropagation();
        removeUnit(key);
      });
      els.rosterList.appendChild(item);
    });
  }

  const points = getRosterPoints();
  const count = getRosterUnitCount();
  const remain = pointLimit - points;

  els.totalPoints.textContent = points;
  els.sumPoints.textContent = points;
  els.sumLimit.textContent = pointLimit;
  els.sumRemain.textContent = remain;
  els.sumRemain.className = remain < 0 ? "over" : "ok";
  els.sumUnits.textContent = count;
  els.headerRemain.textContent = remain;
  els.headerRemain.className = "remain " + (remain < 0 ? "over" : "ok");

  syncCatalogQualifications();
  updateButtons();
  updateFactionTabsVisibility();
  updateBattleButtons();
}

/* =========================================================
   12) ДЕЙСТВИЯ
   ========================================================= */
function addUnit(unitId, q) {
  const unit = getUnitById(unitId);
  if (!unit) return;
  if (unit.noQual) q = BASE_Q;
  const price = unitPrice(unit, q);
  if (getRosterPoints() + price > pointLimit) return;
  let foundKey = null;
  for (const key in roster) {
    if (roster[key].unitId === unitId && roster[key].q === q) { foundKey = key; break; }
  }
  if (foundKey) roster[foundKey].count++;
  else {
    const key = "r" + (rosterCounter++);
    roster[key] = { unitId: unitId, q: q, count: 1 };
  }
  saveRoster();
  resetExportButton();
  renderRoster();
}
function removeUnit(key) {
  if (!roster[key]) return;
  roster[key].count--;
  if (roster[key].count <= 0) delete roster[key];
  saveRoster();
  resetExportButton();
  renderRoster();
}
function clearRoster() {
  roster = {};
  saveRoster();
  if (els.exportArea) els.exportArea.value = "";
  resetExportButton();
  renderRoster();
}

/* =========================================================
   13) ЭКСПОРТ
   ========================================================= */
function exportRoster() {
  const lines = [];
  lines.push("=== ДОРОГА НА БЕРЛИН — РОСТЕР (v20.3) ===");
  lines.push("Лимит очков: " + pointLimit);
  lines.push("Использовано: " + getRosterPoints());
  lines.push("Остаток: " + (pointLimit - getRosterPoints()));
  lines.push("----------------------------------------------");
  const keys = Object.keys(roster).sort((ka, kb) => {
    const ea = roster[ka], eb = roster[kb];
    const ua = getUnitById(ea.unitId), ub = getUnitById(eb.unitId);
    const qa = ua && ua.noQual ? -1 : ea.q;
    const qb = ub && ub.noQual ? -1 : eb.q;
    if (qa !== qb) return qb - qa;
    return (ua ? ua.name : "").localeCompare(ub ? ub.name : "", "ru");
  });
  const fnames = { ussr:"СССР", germany:"Германия", usa:"США", hungary:"Венгрия" };
  for (const key of keys) {
    const entry = roster[key];
    const unit = getUnitById(entry.unitId);
    if (!unit) continue;
    const price = unitPrice(unit, entry.q);
    const qLabel = unit.noQual ? "" : " ★" + entry.q;
    lines.push("[" + (fnames[unit.faction] || unit.faction) + "] " + unit.name + qLabel + " × " + entry.count + " = " + (price * entry.count) + " очк.");
  }
  lines.push("----------------------------------------------");
  lines.push("Итого юнитов: " + getRosterUnitCount());
  lines.push("Итого очков: " + getRosterPoints());
  if (els.exportArea) els.exportArea.value = lines.join("\n");
}

/* =========================================================
   14) ЗАКРЫТИЕ МОДАЛКИ
   ========================================================= */
if (els.modalClose) els.modalClose.addEventListener("click", closeModal);
if (els.modalBackdrop) els.modalBackdrop.addEventListener("click", (e) => {
  if (e.target === els.modalBackdrop) closeModal();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

/* =========================================================
   15) ЗАГРУЗКА units.json
   ========================================================= */
async function loadUnits() {
  let data = null;
  try {
    const res = await fetch("units.json", { cache: "no-store" });
    if (res.ok) data = await res.json();
  } catch (e) { console.warn("units.json не загружен, использую DEFAULT_UNITS", e); }
  if (!data) data = DEFAULT_UNITS;
  const common = data.common || [];
  for (const f in data) {
    if (f === "common") continue;
    UNITS[f] = data[f].slice();
    common.forEach(cu => {
      const copy = JSON.parse(JSON.stringify(cu));
      copy.id = f + "_" + cu.key;
      UNITS[f].push(copy);
    });
    UNITS[f].sort((a, b) => {
      const pa = a.noQual ? a.cost : priceForQualification(a.cost, BASE_Q);
      const pb = b.noQual ? b.cost : priceForQualification(b.cost, BASE_Q);
      if (pa !== pb) return pa - pb;
      return a.name.localeCompare(b.name, "ru");
    });
  }
  renderCatalog();
  renderRoster();
}

/* =========================================================
   16) ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
loadSettings();
loadLimit();
loadFaction();
loadRoster();
loadBattle();

if (els.limitInput) els.limitInput.value = pointLimit;
if (els.limitInput) {
  els.limitInput.addEventListener("input", (e) => {
    const val = parseInt(e.target.value, 10);
    pointLimit = isNaN(val) || val < 0 ? 0 : val;
    saveLimit();
    resetExportButton();
    renderRoster();
  });
}

const factionButtons = document.querySelectorAll(".faction-tabs button");
factionButtons.forEach(btn => {
  if (btn.dataset.faction === currentFaction) {
    factionButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }
  btn.addEventListener("click", () => {
    factionButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFaction = btn.dataset.faction;
    saveFaction();
    resetClearButton();
    resetExportButton();
    renderCatalog();
  });
});

const btnClear = document.getElementById("btnClear");
const btnExport = document.getElementById("btnExport");
const btnImport = document.getElementById("btnImport");
const btnSettings = document.getElementById("btnSettings");
const btnRules = document.getElementById("btnRules");
const btnBattle = document.getElementById("btnBattle");
const btnStop = document.getElementById("btnStop");

if (btnExport) btnExport.addEventListener("click", () => {
  resetClearButton();
  if (!exportArmed) {
    exportRoster();
    exportArmed = true;
    btnExport.textContent = "📋 Скопировать в буфер?";
    btnExport.classList.add("armed");
  } else {
    copyExportToClipboard();
  }
});
if (btnImport) btnImport.addEventListener("click", () => { resetClearButton(); resetExportButton(); openImport(); });
if (btnSettings) btnSettings.addEventListener("click", () => { resetExportButton(); openSettings(); });
if (btnRules) btnRules.addEventListener("click", () => {
  resetClearButton();
  resetExportButton();
  window.open("rules.html", "_blank");
});
if (btnBattle) btnBattle.addEventListener("click", () => {
  if (getRosterUnitCount() === 0) return;
  setBattleMode(true);
});
if (btnStop) btnStop.addEventListener("click", () => setBattleMode(false));

let clearConfirmTimer = null;
let clearPending = false;
function resetClearButton() {
  if (clearConfirmTimer) { clearTimeout(clearConfirmTimer); clearConfirmTimer = null; }
  clearPending = false;
  if (!btnClear) return;
  btnClear.classList.remove("danger");
  btnClear.textContent = "🗑 Очистить";
  btnClear.disabled = false;
}
function armClearButton() {
  clearPending = true;
  if (!btnClear) return;
  btnClear.classList.add("danger");
  btnClear.textContent = "Очистить всё?";
  if (clearConfirmTimer) clearTimeout(clearConfirmTimer);
  clearConfirmTimer = setTimeout(resetClearButton, 3000);
}
if (btnClear) {
  btnClear.addEventListener("click", () => {
    if (!clearPending) { armClearButton(); return; }
    resetClearButton();
    clearRoster();
  });
}
document.addEventListener("click", (e) => {
  if (!clearPending) return;
  if (btnClear && btnClear.contains(e.target)) return;
  resetClearButton();
}, true);

document.body.classList.toggle("in-battle", inBattle);
updateBattleButtons();
resetExportButton();

loadUnits();
</script>
